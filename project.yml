name: GitFolio
options:
  bundleIdPrefix: com.portfolio.gitfolio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages: {}

targets:
  GitFolio:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Sources/Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.portfolio.gitfolio
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: GitFolio
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  GitFolioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/GitFolioTests
    dependencies:
      - target: GitFolio
    settings:
      base:
        SWIFT_VERSION: "5.0"

schemes:
  GitFolio:
    build:
      targets:
        GitFolio: all
        GitFolioTests: [test]
    test:
      targets:
        - GitFolioTests
    run:
      config: Debug
